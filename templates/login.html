<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Pratap Akhand & Associates</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='admin.css') }}"
    >

</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-card">

            <div class="login-logo">
                PA
            </div>

            <h1>Admin Portal</h1>

            <p class="login-subtitle">
                Pratap Akhand & Associates
            </p>

            {% with messages =
                get_flashed_messages(with_categories=true)
            %}

                {% for category, message in messages %}

                    <div class="alert {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endwith %}

            <form method="POST">

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Sign In
                </button>

            </form>

            <div class="login-footer">
                Secure website administration
            </div>

        </div>

    </div>

</body>

</html>
